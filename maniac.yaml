Resources:

  myEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      KeyName: miKeyPair
      ImageId: ami-0049736975ba478c0
      InstanceType: t3.micro
      SecurityGroupIds:
        - !Ref secGroupName
      SubnetId: !Ref subnetName
      IamInstanceProfile: !Ref EC2IAMInstanceProfile # Asociamos el perfil de instancia que contiene los roles para S3 y CloudWatch
      UserData: # Script de inicialización para instalar dependencias y configurar la aplicación Flask
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y python3 pip amazon-cloudwatch-agent

          pip install flask psutil

          cat <<EOF > /home/ec2-user/app.py
          from flask import Flask, jsonify
          import psutil

          app = Flask(__name__)

          @app.route("/status") # Endpoint para verificar el estado de la aplicación
          def status():
              return jsonify({"status": "ok"})

          @app.route("/metrics") # Endpoint para obtener métricas del sistema
          def metrics():
              return jsonify({
                  "cpu": psutil.cpu_percent(),
                  "memory": psutil.virtual_memory().percent,
                  "disk": psutil.disk_usage('/').percent
              })

          @app.route("/hello") # Endpoint para saludar
          def hello():
              return "Hola desde Maniac API!"

          app.run(host="0.0.0.0", port=80)
          EOF

          python3 /home/ec2-user/app.py &
      Tags:
        - Key: Name
          Value: Maniac-EC2


  secGroupName:
    Type: AWS::EC2::SecurityGroup  # Security Group para la instancia EC2
    Properties:
      GroupDescription: SG del proyecto Maniac
      VpcId: !Ref myVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Maniac-SG


  myVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true  # Habilita la resolución de nombres DNS
      Tags:
        - Key: Name
          Value: manIaC-VPC


  subnetName:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref myVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: eu-west-1a   # Zona de disponibilidad para la subred
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: manIaC-Subnet

  subnetName2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref myVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: eu-west-1b   # Zona de disponibilidad para la subred
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: manIaC-Subnet-2


  igwName:
    Type: AWS::EC2::InternetGateway   # Internet Gateway para la VPC
    Properties:
      Tags:
        - Key: Name
          Value: manIaC-IGW


  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment  # Adjunta el Internet Gateway a la VPC
    Properties:
      VpcId: !Ref myVPC
      InternetGatewayId: !Ref igwName  # Referencia al Internet Gateway creado anteriormente


  routeTableName:
    Type: AWS::EC2::RouteTable   # Route Table para la VPC
    Properties:
      VpcId: !Ref myVPC
      Tags:
        - Key: Name
          Value: manIaC-RT


  routeToInternet:
    Type: AWS::EC2::Route  # Ruta para el tráfico hacia Internet
    Properties:
      RouteTableId: !Ref routeTableName
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref igwName  # Referencia al Internet Gateway para enrutar el tráfico hacia Internet


  associateSubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref subnetName
      RouteTableId: !Ref routeTableName

  associateSubnetRouteTable2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref subnetName2
      RouteTableId: !Ref routeTableName

  maniacALBSG:  
    Type: AWS::EC2::SecurityGroup  # Security Group para el Application Load Balancer (ALB)
    Properties:
      GroupDescription: SG para el ALB
      VpcId: !Ref myVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Maniac-ALB-SG


  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup  # Target Group para el Application Load Balancer (ALB)
    Properties:
      VpcId: !Ref myVPC
      TargetType: instance
      Port: 80
      Protocol: HTTP
      HealthCheckPath: /status
      Targets:
        - Id: !Ref myEC2Instance
          Port: 80


  myALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer  # Application Load Balancer (ALB)
    Properties:
      Scheme: internet-facing
      Name: manIaC-ALB
      Subnets:
        - !Ref subnetName
        - !Ref subnetName2  # IMPORTANTE REFERENCIAR LA OTRA SUBNET PARA EL ALB, SINO NO FUNCIONA
      SecurityGroups:
        - !Ref maniacALBSG
      Tags:
        - Key: Name
          Value: manIaC-ALB


  myALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener  # Listener para el Application Load Balancer (ALB)
    Properties:
      LoadBalancerArn: !Ref myALB 
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  
  s3Bucket:
    Type: AWS::S3::Bucket
    Properties: 
      BucketName: "maniac-static-s3-e20001991"  # Nombre unico del bucket
      VersioningConfiguration: 
        Status: Enabled
      PublicAccessBlockConfiguration: 
        BlockPublicAcls: true  # Bloquea el acceso público a los ACLs
        BlockPublicPolicy: true # Bloquea el acceso público a las políticas
        IgnorePublicAcls: true  # Ignora los ACLs públicos
        RestrictPublicBuckets: true # Bloquea el acceso público a los buckets

  EC2InstanceRole: 
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "maniac-ec2-s3-role-${AWS::StackName}"  # Nombre unico del rol 
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy  # Permisos para CloudWatch Agent

  EC2S3Policy:
    Type: AWS::IAM::Policy
    DependsOn: s3Bucket  # Asegura que el bucket S3 se cree antes de la política (sin esto, la política podría fallar si el bucket no existe)
    Properties:
      PolicyName: !Sub "maniac-ec2-s3-policy-${AWS::StackName}"  # Nombre unico de la política
      Roles:
        - !Ref EC2InstanceRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
            Resource: 
              - !Sub "arn:aws:s3:::maniac-static-s3-20001991/*"  # Permisos sobre objetos del bucket
              - !Sub "arn:aws:s3:::maniac-static-s3-20001991"  # Permisos para el bucket en sí
  EC2IAMInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "maniac-ec2-instance-profile-${AWS::StackName}"  # Nombre unico del perfil de instancia
      Roles:
        - !Ref EC2InstanceRole # Asociamos el rol creado anteriormente al perfil de instancia
